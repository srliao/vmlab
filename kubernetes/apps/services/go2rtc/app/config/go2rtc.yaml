---
# NOTE: `$${VAR}` is escaped so Flux's postBuild substitution leaves it alone and
# go2rtc itself expands it from the env vars supplied by the go2rtc-secret.
streams:
  frontdoor: $${FRONTDOOR_RTSP_URL}

api:
  listen: ":1984"

rtsp:
  listen: ":8554"

webrtc:
  listen: ":8555"
  # The pod never sees the LAN address, so advertise the Service's LB IP.
  candidates:
    - 192.168.100.61:8555

log:
  level: info
