---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./pvc.yaml
  - ../../../../templates/volsync
patches:
  - target:
      kind: ReplicationSource
    patch: |-
      - op: add
        path: /spec/paused
        value: true